# A version tag (v0.2.0) builds her Windows installer and puts it on a draft release, to check and publish by hand.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      # No build cache here: a restored one could point the speech library's link step at files that weren't cached
      # with it. A release builds from scratch.
      - run: npm ci
        working-directory: ui
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: node ../ui/node_modules/@tauri-apps/cli/tauri.js
          tagName: ${{ github.ref_name }}
          releaseName: Capricorn ${{ github.ref_name }}
          releaseBody: |
            Capri from *Cyberpunk: Edgerunners*, alive on your Windows desktop. She hears you, talks back, and runs your PC for you.

            **Install:** download the `x64-setup.exe` file below and run it. No admin rights needed. The installer isn't code signed yet, so Windows SmartScreen may warn you: choose **More info**, then **Run anyway**.

            **First start:** she downloads her ears and voice (about 1 GB, once) and offers a local brain through Ollama.

            **Brain:** works best with **Claude Code** (Settings › Brain). NVIDIA is second.

            **Then:** say "Capri" and ask, or press Ctrl+Alt+T to type. Throw her around. Message her from Discord when you're out (Settings › Phone).

            Windows 10 or 11, 64-bit.

          releaseDraft: true
